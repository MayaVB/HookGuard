server {
    listen 80;
    root /usr/share/nginx/html;

    # Same-origin API access: the browser calls /api on the dashboard's origin, nginx forwards it.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Demo receiver controls for the live demo page (trailing slash strips the /receiver prefix).
    location /receiver/ {
        proxy_pass http://demo-receiver:9090/;
    }

    # Single-page app: unknown paths (e.g. /deliveries/<id>) serve index.html.
    location / {
        try_files $uri /index.html;
    }
}
